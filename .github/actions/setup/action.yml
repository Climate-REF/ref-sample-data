name: "Setup Python via pixi"
description: "setup Python and pixi"
runs:
  using: "composite"
  steps:
    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.8.11
      with:
        pixi-version: "v0.54.0"
        cache: false # The self-hosted runners have a local cache
        locked: true
        log-level: "v"
